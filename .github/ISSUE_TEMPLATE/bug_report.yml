name: Bug report
description: Something on grabi.net looks or behaves wrong
labels: [bug]
body:
  - type: input
    id: url
    attributes:
      label: Page URL
      placeholder: https://grabi.net/es
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you see, and what did you expect instead?
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Browser and device
      placeholder: Safari 19 · macOS · iPhone 15
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or extra context
